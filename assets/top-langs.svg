<svg xmlns="http://www.w3.org/2000/svg" width="420" height="165" viewBox="0 0 420 165" role="img" aria-label="Most Used Languages">
  <rect x="0.5" y="0.5" width="419" height="164" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">
    Most Used Languages (Public Repos)
  </text>

  <!-- Progress Bar (width = 372) -->
  <g transform="translate(24, 50)">
    <clipPath id="bar-clip">
      <rect width="372" height="10" rx="5"/>
    </clipPath>
    <g clip-path="url(#bar-clip)">
      <!-- Java 50.8% -> 189px -->
      <rect x="0" y="0" width="189" height="10" fill="#b07219"/>
      <!-- Python 18.3% -> 68px -->
      <rect x="189" y="0" width="68" height="10" fill="#3572A5"/>
      <!-- CSS 12.0% -> 45px -->
      <rect x="257" y="0" width="45" height="10" fill="#563d7c"/>
      <!-- JavaScript 11.2% -> 42px -->
      <rect x="302" y="0" width="42" height="10" fill="#f1e05a"/>
      <!-- HTML 7.7% -> 28px -->
      <rect x="344" y="0" width="28" height="10" fill="#e34c26"/>
    </g>
  </g>

  <!-- Legend Left Column -->
  <g transform="translate(24, 84)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">
    <circle cx="6" cy="-4" r="5" fill="#b07219"/>
    <text x="18" y="0"><tspan font-weight="600">Java</tspan> <tspan fill="#8b949e">50.8%</tspan></text>

    <circle cx="6" cy="22" r="5" fill="#563d7c"/>
    <text x="18" y="26"><tspan font-weight="600">CSS</tspan> <tspan fill="#8b949e">12.0%</tspan></text>

    <circle cx="6" cy="48" r="5" fill="#e34c26"/>
    <text x="18" y="52"><tspan font-weight="600">HTML</tspan> <tspan fill="#8b949e">7.7%</tspan></text>
  </g>

  <!-- Legend Right Column -->
  <g transform="translate(220, 84)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">
    <circle cx="6" cy="-4" r="5" fill="#3572A5"/>
    <text x="18" y="0"><tspan font-weight="600">Python</tspan> <tspan fill="#8b949e">18.3%</tspan></text>

    <circle cx="6" cy="22" r="5" fill="#f1e05a"/>
    <text x="18" y="26"><tspan font-weight="600">JavaScript</tspan> <tspan fill="#8b949e">11.2%</tspan></text>
  </g>
</svg>
